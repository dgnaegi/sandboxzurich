# Push to main -> build the site and deploy it to Cloudflare.
# World data (tiles/textures) comes from the release "world-data" (deploy/publish_world.sh).
# Secrets: CLOUDFLARE_API_TOKEN (template "Edit Cloudflare Workers"), CLOUDFLARE_ACCOUNT_ID.
name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency: deploy
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: World data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download world-data -p world-data.tar.gz -D /tmp
          tar -xzf /tmp/world-data.tar.gz -C web/public
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build
        working-directory: web
        run: npm ci && npm run build
      - name: Deploy
        working-directory: web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
